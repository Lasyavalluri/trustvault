services:
  - type: web
    name: trustvault-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_demo.sh
    healthCheckPath: /health
    envVars:
      - key: TRUSTVAULT_ENV
        value: production
      - key: TRUSTVAULT_AUDIT_KEY
        generateValue: true
